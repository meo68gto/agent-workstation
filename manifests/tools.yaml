# Agent Workstation — Canonical Capability Catalog
# Exactly 50 primary capabilities. Numbers 1–50 must be unique and sequential.
# This file is the single source of truth for capability identity and contracts.
schema_version: 1

tools:
  - number: 1
    id: python
    name: Python 3
    kind: runtime
    category: runtimes-interactive
    canonical:
      project_name: Python
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      repository: https://github.com/python/cpython
    license:
      expression: PSF-2.0
      classification: osi_open_source
    support:
      operating_systems: [linux]
      architectures: [amd64, arm64]
      debian_13: supported
    commands:
      primary: [python3]
      alternatives: [python]
    depends_on: []
    install:
      preferred_strategy: apt
      requires_sudo: true
    persistence:
      classification: recreateable
    verify:
      - id: version
        type: exec
        argv: [python3, --version]
      - id: functional
        type: exec
        argv: [python3, -c, "print(2+2)"]

