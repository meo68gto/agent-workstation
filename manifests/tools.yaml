  - number: 41
    id: n8n
    name: n8n
    kind: persistent-service
    category: workflow-automation
    canonical:
      project_name: n8n
      homepage: https://n8n.io/
      repository: https://github.com/n8n-io/n8n
    license:
      expression: SEE LICENSE IN LICENSE.md
      classification: source_available
    support:
      operating_systems: [linux]
      architectures: [amd64, arm64]
      debian_13: supported
    commands:
      primary: []
    depends_on: [docker]
    install:
      preferred_strategy: docker-compose
      requires_sudo: true
    persistence:
      classification: critical
      contains_secrets: true
      paths: ["<state-root>/state/services/n8n"]
    service:
      enabled: true
      ports: [5678]
    verify:
      - id: health
        type: http
        url: http://127.0.0.1:5678/healthz

